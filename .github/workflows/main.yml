name: Auto Sync Forks (Force Clean)

on:
  push:
    branches:
      - main  # change if your main branch is named differently
  workflow_dispatch:

jobs:
  sync_forks:
    runs-on: ubuntu-latest
    name: Force sync main branch of all forks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_UPDATE_PAT }}

      - name: Get list of forks
        id: get_forks
        run: |
          FORKS=$(curl -s -H "Authorization: token ${{ secrets.FORK_UPDATE_PAT }}" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/forks" | \
            jq -r '.[] | .full_name')
          echo "FORK_LIST<<EOF" >> $GITHUB_ENV
          echo "$FORKS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "Forks to be updated:"
          echo "$FORKS"

      - name: Force sync each fork
        run: |
          IFS=$'\n'
          for FORK in $FORK_LIST; do
            echo "Syncing fork: $FORK"

            FORK_URL="https://x-access-token:${{ secrets.FORK_UPDATE_PAT }}@github.com/${FORK}.git"
            git clone --quiet --single-branch --branch main $FORK_URL fork_repo || { echo "Failed to clone $FORK"; continue; }
            cd fork_repo

            git remote add upstream https://github.com/$GITHUB_REPOSITORY.git
            git fetch upstream main

            git reset --hard upstream/main

            # Optional: remove workflows if needed
            rm -rf .github/workflows/

            git add -A
            git commit -m "Clean sync with upstream (without workflows)" || echo "Nothing to commit"
            git push origin main --force

            echo "Fork $FORK synced successfully"
            cd ..
            rm -rf fork_repo
          done
